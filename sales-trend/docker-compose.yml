name: sales-trend

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sales_trend}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: Asia/Shanghai
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  etl:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - python
      - -m
      - etl.loader
      - --workbook
      - ${WORKBOOK_PATH:-/app/data/sample_sales.xlsx}
      - --verify-sample
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/sales_trend}
      WORKBOOK_SHEET: ${WORKBOOK_SHEET:-sample_sales_data}
      SQL_DIR: /app/sql
      TZ: Asia/Shanghai
    volumes:
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/sales_trend}
      TZ: Asia/Shanghai
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      etl:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata: